name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    # A hung step fails within the hour, not at GitHub's six.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # The v1 tag is frozen and no longer moves.
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: vp check
      - run: vp run check:tokens
      - run: vp run test:tooling
      - run: vp test run
      # Preflight copies docs/local.env.example → .env (ENVIRONMENT=local stand-ins
      # for email/analysis). Workers AI is remote:true, so preview still needs a
      # Cloudflare token to start the remote proxy even when analysis is stubbed.
      - run: vp run test:smoke
        timeout-minutes: 15
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore

  deploy:
    # Production: only from main, and only once every check above has passed.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # One deploy at a time; a newer push waits rather than racing the older one.
    concurrency:
      group: production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: voidzero-dev/setup-vp@v1.21.2
        with:
          node-version-file: .node-version
          cache: true
      - run: vp run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
